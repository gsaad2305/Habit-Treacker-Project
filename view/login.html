<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="login">
  <meta name="keywords" content="login, descrições, contas">
  <link rel="stylesheet" href="../public/css/auth.css">
  <title>Login</title>
</head>

<body>
  <form method="post">
    <h1>Login</h1>

    <div class="groupe">
      <input type="email" id="email" placeholder="exemple@gmail.com" name="email">
      <img src="../public/img/e-mail.png" alt="user">
    </div>
    <div class="groupe">
      <input type="password" id="pass" placeholder="password" name="password">
      <img src="../public/img/locked.png" alt="email">
    </div>


    <button type="submit">Logar</button>
    <div class="auth-switch">
      <span>Não tem uma conta?</span>
      <a href="registrar.html">Cadastre-se</a>
    </div>
  </form>

  <script>
    const form = document.querySelector("form")
    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("pass");

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const response = await fetch("http://localhost:3001/login", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value.trim(),
          password: passInput.value
        })
      });
      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        alert(errorData.message || 'Email ou senha inválidos.');
        return;
      }
      const data = await response.json();
      if (data.acessToken) {
        alert("Login feito com sucesso")
        localStorage.setItem('token', data.acessToken)
        window.location.href = 'task.html'
      }
    })
  </script>
</body>

</html>
