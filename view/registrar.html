<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="login">
  <meta name="keywords" content="login, descrições, contas">
  <link rel="stylesheet" href="../public/css/auth.css">
  <title>Login</title>
</head>

<body>
  <form method="post">
    <h1>Login</h1>
    <div class="groupe">
      <input type="name" id="name" placeholder="Username" name="name">
      <img src="../public/img/user.png" alt="user">
    </div>
    <div class="groupe">
      <input type="email" id="email" placeholder="exemple@gmail.com" name="email">
      <img src="../public/img/e-mail.png" alt="user">
    </div>
    <div class="groupe">
      <input type="password" id="pass" placeholder="password" name="password">
      <img src="../public/img/locked.png" alt="email">
    </div>


    <button type="submit">Logar</button>
    <div class="auth-switch">
      <span>Já tem uma conta?</span>
      <a href="login.html">Entrar</a>
    </div>
  </form>

  <script>
    const form = document.querySelector("form")
    const nameInput = document.getElementById("name")
    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("pass");

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const response = await fetch("http://localhost:3001/register", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: nameInput.value.trim(),
          email: emailInput.value.trim(),
          password: passInput.value
        })
      });
      alert("Conta criada com sucesso")
      window.location.href = "login.html"
    })
  </script>
</body>

</html>
