<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="login">
    <meta name="keywords" content="login, descrições, contas">
    <title>Login</title>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

form {
  background-color: #ffffff1d;
  background-clip: blur(10px);
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  height: auto;
  display: flex;
  gap: 12px;
  flex-direction: column;
  margin-top: 0;
  border: 2px solid #a9a9a917;
  border-radius: 15px;
}

h1 {
  text-align: center;
  color: #f5f5f5;
  font-size: 2.5em;
  margin-bottom: 30px;
  font-weight: 500;
  letter-spacing: 1px;
}



.groupe{
  position: relative;
  width: 100%;
}

.groupe  input {
  padding: 12px 12px 12px 45px;
  border-radius: 10px;
  color: #ecf0f1;
  width: 100%;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.05);
  margin-bottom: 10px;
  transition: all 0.3s ease;
  outline: none;
}

.groupe input::placeholder {
  color: #ffffff46;
  font-weight: 200;
}

.groupe input:invalid {
  color: #ff0000;
}
.groupe img{
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 25px;
  height: 25px;
  pointer-events: none;
}
button {
  position: relative;
  color: #f9ffff;
  border: 2px solid #0ff;
  width: 300px;
  margin-top: 30px;
  border-radius: 10px;
  padding: 10px;
  overflow: hidden;
  background-color: transparent;
  z-index: 1;
  transition: all 0.3s ease-in-out;
}

button::before {
  content: "";
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #3ca9a9;
  position: absolute;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease-in-out;
  z-index: -1;
}

button:hover::before {
  transform: scaleX(1);
}

</style>

</head>

<body>
    <form  method="post">
        <h1>Login</h1>

        <div class="groupe">
            <input type="text" id="name" placeholder="Username" name="name">
            <img src="../public/img/user.png" alt="user">
        </div>
        <div class="groupe">
            <input type="password" id="pass" placeholder="password" name="password">
            <img src="../public/img/locked.png" alt="email">
        </div>


        <button type="submit">Logar</button>
    </form>
</body>

</html>
